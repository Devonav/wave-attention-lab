name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-correctness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DWAVE_ENABLE_HIP=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: C++ tests
        run: ctest --test-dir build --output-on-failure
      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: CLI smoke test
        run: ./build/wave_bench --backend cpu --heads 2 --sequence 16 --dimension 8 --iterations 1

